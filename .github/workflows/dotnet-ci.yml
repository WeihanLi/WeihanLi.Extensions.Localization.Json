name: dotnet-ci

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
    - name: dotnet info
      run: dotnet --info
    - name: build
      run: bash build.sh
